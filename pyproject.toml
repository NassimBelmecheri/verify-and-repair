[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verify-and-repair"
version = "0.5.0"
description = "Lean verification-guided coding repair for Agency and GitHub Copilot CLI"
readme = "README.md"
license = "LicenseRef-Personal-Evaluation-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "crosshair-tool>=0.0.80",
  "z3-solver>=4.13"
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6",
]
mcp = [
  "mcp>=1.12,<2",
]

[project.scripts]
verify-and-repair = "verify_and_repair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
